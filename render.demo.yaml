services:
  - type: web
    name: bond-openai-demo-relay
    runtime: docker
    # Free is sufficient for the one-day demo. The relay keeps only ephemeral
    # call state; provider credentials remain in Render's secret environment.
    plan: free
    dockerfilePath: ./deploy/Dockerfile.relay
    healthCheckPath: /healthz
    envVars:
      - key: FREDO_TELEPHONY_PROVIDER
        value: real
      - key: FREDO_HOST
        value: 0.0.0.0
      - key: FREDO_PORT
        value: 10000
      - key: FREDO_STATE_DIR
        value: /tmp/fredo-state
      - key: FREDO_MAX_DURATION_SECONDS
        value: 180
      - key: FREDO_MAX_CONCURRENT_CALLS
        value: 1
      - key: FREDO_DEMO_PUBLIC
        value: 1
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: FREDO_ENDPOINT_SECRET
        sync: false
      - key: FREDO_ALLOWED_NUMBERS
        sync: false
      - key: FREDO_PUBLIC_URL
        sync: false
