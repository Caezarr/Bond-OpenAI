[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "bond-openai-mcp"
version = "0.1.0"
description = "A local, provider-neutral MCP phone action for Bond, Codex and compatible agents."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Bond-OpenAI" }]
dependencies = [
  "deepgram-sdk==7.8.1",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.14.0",
  "python-dotenv==1.2.3",
  "python-multipart==0.0.32",
  "starlette==1.6.0",
  "twilio==9.11.1",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=0.25,<2",
  "jsonschema>=4.25,<5",
  "ruff>=0.12,<1",
]

[project.scripts]
bond-mcp = "bond_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fredo", "src/bond_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
