[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "bond-openai-mcp"
version = "0.1.0"
description = "A local, provider-neutral MCP phone action for Bond, Codex and compatible agents."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Bond-OpenAI" }]
dependencies = [
  "deepgram-sdk==7.19.0",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.15.1",
  "python-dotenv==1.2.4",
  "python-multipart==0.0.34",
  "starlette==1.10.0",
  "twilio==9.13.0",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=0.25,<2",
  "jsonschema>=4.25,<5",
  "mypy>=1.13,<3",
  "ruff>=0.12,<1",
]

[project.scripts]
bond-mcp = "bond_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fredo", "src/bond_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["twilio.*"]
ignore_missing_imports = true
