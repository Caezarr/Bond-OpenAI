name: Bug report
description: Report a bug in Bond OpenAI
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, env, or payload
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - mcp
        - voice
        - demo
        - deploy
        - ci
        - other
    validations:
      required: true
